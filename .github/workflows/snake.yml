name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari
  workflow_dispatch:       # bisa dijalankan manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C8553D&color_dots=#EFE6D2,#F3D99B,#E1A730,#D9792F,#C8553D
            dist/github-snake-dark.svg?color_snake=#E1A730&color_dots=#2A2420,#5C4033,#8C5A3C,#C8553D,#E1A730

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
