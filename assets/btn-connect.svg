<svg xmlns="http://www.w3.org/2000/svg" width="260" height="52" viewBox="0 0 260 52" role="img" aria-label="Connect on LinkedIn">
  <!-- Sketch shadow in muted green -->
  <path d="M9,9 Q130,7 251,8 Q253,27 252,45 Q130,47 8,45 Z" fill="#139A53" opacity=".25" transform="translate(2, 2)"/>
  <!-- Main sketch button -->
  <path d="M7,7 Q130,5.5 250,7 Q252,26 251,44 Q130,45.5 6,44 Q4.5,26 7,7 Z" fill="#EFEADC" stroke="#1B1B1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Double-line sketch detail -->
  <path d="M9.5,9.5 Q130,8 247.5,9.5 Q249.5,26 248.5,41.5 Q130,43 8.5,41.5" fill="none" stroke="#9A9585" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
  <!-- LinkedIn icon -->
  <g transform="translate(22, 16)" fill="none" stroke="#1B1B1B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="20" height="20" rx="4"/>
    <circle cx="5.5" cy="5.5" r=".9" fill="#139A53" stroke="none"/>
    <line x1="5.5" y1="9" x2="5.5" y2="15"/>
    <path d="M10,15 V11.5 A2.5,2.5 0 0 1 15,11.5 V15"/>
    <line x1="10" y1="15" x2="10" y2="11"/>
  </g>
  <!-- Text -->
  <text x="52" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="600" fill="#1B1B1B" letter-spacing="0.2">Connect on LinkedIn</text>
  <!-- Arrow pointer -->
  <path d="M218,29 L227,20 M221,20 L227,20 L227,26" fill="none" stroke="#139A53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
