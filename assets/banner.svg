<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Nurul Fauziah, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1D3557"><animate attributeName="stop-color" values="#1D3557;#2a4d78;#1D3557" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#457B9D"><animate attributeName="stop-color" values="#457B9D;#2f6b8e;#457B9D" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#F1FAEE"/><stop offset="1" stop-color="#A8DADC"/></linearGradient>
  <clipPath id="cp"><rect width="1000" height="280" rx="18"/></clipPath>
</defs>
<style>
  .name{font:800 62px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:url(#nm);letter-spacing:1px;animation:rise 1.2s ease-out both}
  .role{font:500 20px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A8DADC;letter-spacing:7px;animation:rise 1.2s .45s ease-out both}
  .jp{font:400 16px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F1FAEE;animation:fade 2s 1.2s both}
  .code{font:600 30px 'Fira Code','JetBrains Mono',Consolas,Menlo,monospace;fill:#F1FAEE;opacity:.16}
  .glyph{font:700 40px 'Fira Code','JetBrains Mono',Consolas,Menlo,monospace;fill:#F1FAEE;animation:pulse 3s ease-in-out infinite}
  .bar{fill:#A8DADC;animation:grow 1.4s .9s ease-out both}
  .fl{animation:float 7s ease-in-out infinite}
  .tw{animation:twinkle 3s ease-in-out infinite}
  .ring1{transform-origin:830px 135px;animation:spin 22s linear infinite}
  .ring2{transform-origin:830px 135px;animation:spin 14s linear infinite reverse}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:.75}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes grow{from{width:0}to{width:90px}}
</style>
<g clip-path="url(#cp)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <circle cx="150" cy="230" r="110" fill="#A8DADC" opacity=".07" class="fl"/>
  <circle cx="900" cy="30" r="90" fill="#F1FAEE" opacity=".06" class="fl" style="animation-delay:2s"/>
  <circle cx="120" cy="40" r="2.2" fill="#F1FAEE" class="tw" style="animation-delay:0s"/><circle cx="260" cy="70" r="1.6" fill="#F1FAEE" class="tw" style="animation-delay:1.2s"/><circle cx="380" cy="30" r="2" fill="#F1FAEE" class="tw" style="animation-delay:2.1s"/><circle cx="520" cy="60" r="1.5" fill="#F1FAEE" class="tw" style="animation-delay:0.6s"/><circle cx="640" cy="35" r="2.4" fill="#F1FAEE" class="tw" style="animation-delay:1.7s"/><circle cx="720" cy="95" r="1.6" fill="#F1FAEE" class="tw" style="animation-delay:2.6s"/><circle cx="930" cy="40" r="2" fill="#F1FAEE" class="tw" style="animation-delay:0.9s"/><circle cx="960" cy="150" r="1.5" fill="#F1FAEE" class="tw" style="animation-delay:2.2s"/><circle cx="60" cy="150" r="1.6" fill="#F1FAEE" class="tw" style="animation-delay:1.5s"/><circle cx="470" cy="120" r="1.4" fill="#F1FAEE" class="tw" style="animation-delay:3s"/>
  <text x="560" y="70" class="code fl" style="animation-delay:0s" text-anchor="middle">{ }</text><text x="640" y="215" class="code fl" style="animation-delay:2s" text-anchor="middle">=></text><text x="330" y="40" class="code fl" style="animation-delay:4s" text-anchor="middle">;</text><text x="900" y="225" class="code fl" style="animation-delay:1s" text-anchor="middle">#</text><text x="190" y="60" class="code fl" style="animation-delay:3s" text-anchor="middle">[ ]</text>
  <g>
    <circle cx="830" cy="135" r="46" fill="#A8DADC" opacity=".10"><animate attributeName="r" values="40;54;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle class="ring1" cx="830" cy="135" r="84" fill="none" stroke="#A8DADC" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 12"/>
    <circle class="ring2" cx="830" cy="135" r="62" fill="none" stroke="#F1FAEE" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="30 14"/>
    <text class="glyph" x="830" y="149" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <text class="name" x="70" y="125">Nurul Fauziah</text>
  <text class="role" x="72" y="165">FULL STACK DEVELOPER</text>
  <rect class="bar" x="72" y="184" height="3" rx="1.5"/>
  <text class="jp" x="72" y="222">少しずつでも、前に進む。</text>
  <path d="M0,236 Q62.5,222 125,236 T250,236 T375,236 T500,236 T625,236 T750,236 T875,236 T1000,236 T1125,236 T1250,236 T1375,236 V300 H0 Z" fill="#F1FAEE" opacity=".08"><animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="9s" repeatCount="indefinite"/></path>
  <path d="M0,252 Q62.5,240 125,252 T250,252 T375,252 T500,252 T625,252 T750,252 T875,252 T1000,252 T1125,252 T1250,252 T1375,252 V300 H0 Z" fill="#A8DADC" opacity=".12"><animateTransform attributeName="transform" type="translate" from="-250 0" to="0 0" dur="12s" repeatCount="indefinite"/></path>
  <path d="M0,266 Q62.5,256 125,266 T250,266 T375,266 T500,266 T625,266 T750,266 T875,266 T1000,266 T1125,266 T1250,266 T1375,266 V300 H0 Z" fill="#1D3557" opacity=".35"><animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="7s" repeatCount="indefinite"/></path>
</g>
</svg>
