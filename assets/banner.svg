<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Nurul Fauziah, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="cp"><rect width="1000" height="280" rx="18"/></clipPath></defs>
<style>
  .name{font:800 60px Futura,'Century Gothic','Trebuchet MS',Avenir,'Segoe UI',sans-serif;fill:#5C4033;letter-spacing:1px;animation:rise 1.2s ease-out both}
  .role{font:600 19px Futura,'Century Gothic','Trebuchet MS',Avenir,'Segoe UI',sans-serif;fill:#C8553D;letter-spacing:8px;animation:rise 1.2s .45s ease-out both}
  .jp{font:400 16px Futura,'Century Gothic','Trebuchet MS',Avenir,'Segoe UI',sans-serif;fill:#5C4033;animation:fade 2s 1.2s both}
  .bar{fill:#E1A730;animation:grow 1.4s .9s ease-out both}
  .bob{animation:bob 6s ease-in-out infinite}
  .disc{transform-origin:830px 128px;animation:spin 40s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:.75}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes grow{from{width:0}to{width:90px}}
</style>
