      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 12 12; 25 12 12; -20 12 12; 0 12 12" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.35; 0.7; 1"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="#34D399" stroke="#EFEADC" stroke-width="1.5"/>
      </g>
    </g>

    <path d="M125,22 Q145,28 165,23 Q185,19 205,24" fill="none" stroke="#EFEADC" stroke-width="1.4" stroke-linecap="round"/>

    <text x="218" y="28" class="t-title">Exploring</text>
    <text x="24" y="55" class="t-desc">System architecture patterns, monorepos, and clean boundaries</text>
  </g>

  <!-- Card 3: Experimenting -->
  <g transform="translate(8, 90)">
    <path d="M4,4 Q218,2 432,4 Q434,38 432,74 Q218,76 4,74 Q2,38 4,4 Z" fill="#14181F" stroke="#EFEADC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6.5,6.5 Q218,4.5 429.5,6.5 Q431,38 429.5,71.5 Q218,73.5 6.5,71.5" fill="none" stroke="#6E6A60" stroke-width=".8" stroke-linecap="round" opacity=".5"/>

