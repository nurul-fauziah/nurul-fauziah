    <circle cx="105" cy="24" r="13" fill="#0D1117" stroke="#EFEADC" stroke-width="1.4"/>
    <circle cx="105" cy="24" r="11" fill="none" stroke="#34D399" stroke-width=".8" stroke-dasharray="2 2"/>
    <g transform="translate(97, 16) scale(0.666)" fill="none" stroke="#EFEADC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
