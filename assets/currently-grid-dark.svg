    <path d="M125,22 Q145,28 165,23 Q185,19 205,24" fill="none" stroke="#EFEADC" stroke-width="1.4" stroke-linecap="round"/>

    <text x="218" y="28" class="t-title">Learning <tspan font-family="'Yu Mincho', serif" font-size="11.5" font-weight="normal" fill="#34D399"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>(日本語)</tspan></text>
    <text x="24" y="55" class="t-desc">Japanese language studies, little by little (少しずつでも、前に進む)</text>
