      <line x1="8.5" x2="15.5" y1="2" y2="2"/>
      <path d="M8.5 15h7" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="11" cy="18" r="1.3" fill="#34D399" stroke="none">
        <animate attributeName="cy" values="18;13" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="13.5" cy="19" r="1" fill="#34D399" stroke="none">
        <animate attributeName="cy" values="19;14" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M125,22 Q145,28 165,23 Q185,19 205,24" fill="none" stroke="#EFEADC" stroke-width="1.4" stroke-linecap="round"/>

    <text x="218" y="28" class="t-title">Experimenting</text>
    <text x="24" y="55" class="t-desc">Document automation, data parsing, and developer tooling</text>
