    <path d="M125,22 Q145,28 165,23 Q185,19 205,24" fill="none" stroke="#EFEADC" stroke-width="1.4" stroke-linecap="round"/>

    <text x="218" y="28" class="t-title">Building <tspan fill="#34D399"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
