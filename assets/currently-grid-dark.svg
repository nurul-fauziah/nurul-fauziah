  <!-- Card 4: Learning -->
  <g transform="translate(456, 90)">
    <path d="M4,4 Q218,2 432,4 Q434,38 432,74 Q218,76 4,74 Q2,38 4,4 Z" fill="#14181F" stroke="#EFEADC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
