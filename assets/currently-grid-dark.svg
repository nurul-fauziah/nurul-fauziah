    <path d="M6.5,6.5 Q218,4.5 429.5,6.5 Q431,38 429.5,71.5 Q218,73.5 6.5,71.5" fill="none" stroke="#6E6A60" stroke-width=".8" stroke-linecap="round" opacity=".5"/>

