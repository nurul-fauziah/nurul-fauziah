<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Build. Learn. Improve. Repeat. — Nurul Fauziah">
  <defs>
    <filter id="grain-ft" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ft-clip"><rect width="1000" height="150" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#ft-clip)">
    <!-- Paper surface -->
    <rect width="1000" height="150" fill="#EFEADC"/>
    <rect width="1000" height="150" filter="url(#grain-ft)" opacity=".06"/>

    <!-- Hand-drawn top and bottom bounding sketch lines -->
    <path d="M15,14 Q260,11 500,14 T985,13" fill="none" stroke="#1B1B1B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M18,17 Q260,14 500,16 T982,16" fill="none" stroke="#9A9585" stroke-width=".8" stroke-linecap="round" opacity=".5"/>

    <!-- Left detail: Botanical sprout with gentle breeze sway -->
    <g transform="translate(65, 42)">
      <!-- Animated gentle sway -->
      <g fill="none" stroke="#1B1B1B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" values="0 20 65; 3 20 65; -2 20 65; 0 20 65" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.35; 0.7; 1"/>
        <!-- Main stem -->
        <path d="M20,65 Q22,35 15,10 Q28,25 35,45 Q32,58 20,65" fill="#E4DECB" opacity=".7"/>
        <path d="M20,65 Q22,35 15,10"/>
        <!-- Leaves -->
        <path d="M16,40 Q6,35 2,22 Q12,25 17,35" fill="#139A53" fill-opacity=".22" stroke="#139A53"/>
        <path d="M18,25 Q28,18 36,8 Q34,22 20,22" fill="#139A53" fill-opacity=".22" stroke="#139A53"/>
      </g>
      <!-- Small sketch crosshatch ground -->
      <path d="M-6,68 L-1,63 M-2,68 L3,63 M2,68 L7,63" stroke="#9A9585" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Center editorial text block -->
    <g transform="translate(500, 48)" text-anchor="middle">
      <!-- Japanese Quote -->
      <text y="0" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif" font-size="20" fill="#1B1B1B" letter-spacing="3">少しずつでも、前に進む。</text>
      <!-- Subtitle translation -->
      <text y="24" font-family="'Courier Prime', Consolas, 'Courier New', monospace" font-size="12" fill="#6E6A60" letter-spacing="1">EVEN LITTLE BY LITTLE, KEEP MOVING FORWARD.</text>
      <!-- Editorial motto tag with subtle pulsing dot -->
      <g transform="translate(0, 48)">
        <rect x="-140" y="-12" width="280" height="22" fill="#E4DECB" stroke="#1B1B1B" stroke-width="1.2" rx="3"/>
        <circle cx="-125" cy="-1" r="2.5" fill="#139A53">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text y="3" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1B1B1B" letter-spacing="1.5">BUILD · LEARN · IMPROVE · REPEAT</text>
        <circle cx="125" cy="-1" r="2.5" fill="#139A53">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Right detail: Ink studio seal / stamp with rotating watermark ring -->
    <g transform="translate(870, 75)">
      <!-- Outer imperfect circle -->
      <path d="M0,-42 A42,42 0 1,1 -0.5,-42" fill="none" stroke="#1B1B1B" stroke-width="1.8" stroke-dasharray="4 2" opacity=".85"/>
      <!-- Slowly rotating dashed seal ring -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="#139A53" stroke-width="1.4" stroke-dasharray="4 3" opacity=".6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <!-- Inner text -->
      <text y="-8" text-anchor="middle" font-family="'Courier Prime', Consolas, monospace" font-size="8.5" font-weight="700" fill="#1B1B1B" letter-spacing="1.2">NURUL FAUZIAH</text>
      <text y="6" text-anchor="middle" font-family="'Courier Prime', Consolas, monospace" font-size="7.5" fill="#6E6A60" letter-spacing="1">STUDIO ARCHIVE</text>
      <!-- Little ink star -->
      <path d="M0,14 L0,22 M-4,18 L4,18 M-3,15 L3,21 M-3,21 L3,15" stroke="#139A53" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Bottom bounding sketch line -->
    <path d="M15,136 Q260,138 500,136 T985,137" fill="none" stroke="#1B1B1B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M18,133 Q260,135 500,134 T982,134" fill="none" stroke="#9A9585" stroke-width=".8" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
