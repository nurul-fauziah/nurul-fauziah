<svg xmlns="http://www.w3.org/2000/svg" width="144" height="42" viewBox="0 0 144 42" role="img" aria-label="LinkedIn">
  <!-- Sketch shadow -->
  <path d="M7,8 Q72,6 138,7 Q140,22 139,37 Q72,39 6,37 Z" fill="none" stroke="#139A53" stroke-width="2" opacity=".35" transform="translate(1.5, 1.5)"/>
  <!-- Sketch card -->
  <path d="M6,6 Q72,5 137,6 Q139,21 138,36 Q72,37 5,36 Q4,21 6,6 Z" fill="#EFEADC" stroke="#1B1B1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtle contour line -->
  <path d="M7.5,7.5 Q72,6.5 135.5,7.5 Q137,21 136.5,34.5 Q72,35.5 6.5,34.5" fill="none" stroke="#9A9585" stroke-width=".8" stroke-linecap="round" opacity=".5"/>
  <!-- LinkedIn icon (hand-drawn style) -->
  <g transform="translate(16, 11)" fill="none" stroke="#1B1B1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="20" height="20" rx="4"/>
    <circle cx="5.5" cy="5.5" r=".9" fill="#139A53" stroke="none"/>
    <line x1="5.5" y1="9" x2="5.5" y2="15"/>
    <path d="M10,15 V11.5 A2.5,2.5 0 0 1 15,11.5 V15"/>
    <line x1="10" y1="15" x2="10" y2="11"/>
  </g>
  <!-- Label -->
  <text x="45" y="25.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1B1B1B" letter-spacing="0.3">LinkedIn</text>
  <!-- Arrow -->
  <path d="M110,23 L117,16 M112,16 L117,16 L117,21" fill="none" stroke="#139A53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
